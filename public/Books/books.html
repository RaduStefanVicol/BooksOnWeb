<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Books – Books on Web</title>
    <link rel="stylesheet" href="books.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div class="logo">📖 Books</div>
        <div>
            <a href="/Homepage/homepage.html" class="back-btn">🏠 Homepage</a>
            <button id="logout" class="logout-btn">Logout</button>
        </div>
    </nav>

    <h1>Adaugă o carte nouă</h1>

    <form id="addBookForm">
        <input type="text" id="title" placeholder="Titlul cărții" required>
        <input type="text" id="author" placeholder="Autor" required>
        <input type="number" id="year" placeholder="Anul publicării" required>
        <input type="text" id="category" placeholder="Categorie" required>
        <button type="submit">Adaugă</button>
    </form>

    <h2>Cărțile disponibile</h2>
    <section id="bookList" class="book-list"></section>
</div>

<script src="books.js"></script>
</body>
</html>
