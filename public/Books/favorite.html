<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Cărți Favorite – Books on Web</title>
  <link rel="stylesheet" href="favorite.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
  <nav class="navbar">
    <div class="logo">Cărți Favorite</div>
    <a href="/Books/books.html" class="back-btn">← Înapoi la cărți</a>
  </nav>

  <h2>Lista cărților favorite</h2>
  <section id="favoriteList" class="book-list"></section>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const list = document.getElementById("favoriteList");
    const token = localStorage.getItem("token");

    function loadFavoriteList() {
      fetch("/api/favorite", {
        headers: { Authorization: `Bearer ${token}` }
      })
              .then(res => res.json())
              .then(books => {
                list.innerHTML = "";
                books.reverse().forEach(book => {
                  const card = document.createElement("div");
                  card.className = "book-card";
                  card.innerHTML = `
              <strong>${book.title}</strong><br>
              <span>de ${book.author} (${book.year || "-"})</span><br>
              <em>${book.category || ""}</em><br>
            `;

                  const readBtn = document.createElement("button");
                  readBtn.textContent = "Citește";
                  readBtn.onclick = () => {
                    fetch("/api/reading", {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                      },
                      body: JSON.stringify(book)
                    }).then(() => window.location.href = "/Books/citire.html");
                  };

                  const groupBtn = document.createElement("button");
                  groupBtn.textContent = "Citire în grup";
                  groupBtn.onclick = () => {
                    fetch("/api/group-reading", {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify(book)
                    }).then(() => window.location.href = "/Books/citire-grup.html");
                  };

                  const removeBtn = document.createElement("button");
                  removeBtn.textContent = "Elimină";
                  removeBtn.onclick = () => {
                    const params = new URLSearchParams({
                      title: book.title,
                      author: book.author
                    });

                    fetch(`/api/favorite?${params.toString()}`, {
                      method: "DELETE",
                      headers: { Authorization: `Bearer ${token}` }
                    })
                            .then(res => res.json())
                            .then(() => loadFavoriteList())
                            .catch(() => alert("Eroare la eliminare"));
                  };

                  card.appendChild(readBtn);
                  card.appendChild(groupBtn);
                  card.appendChild(removeBtn);
                  list.appendChild(card);
                });
              });
    }

    loadFavoriteList();
  });
</script>
</body>
</html>
