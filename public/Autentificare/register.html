<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Înregistrare - Books on Web</title>
    <link rel="stylesheet" href="register.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="register-container">
    <h1>📝 Înregistrare</h1>
    <p class="subtitle">Creează-ți un cont și pornește aventura lecturii!</p>

    <form id="registerForm">
        <input type="text" id="username" name="username" placeholder="👤 Nume utilizator" required>
        <input type="password" id="password" name="password" placeholder="🔒 Parolă" required>
        <input type="password" id="confirm" name="confirm" placeholder="🔁 Confirmare parolă" required>
        <button type="submit" class="btn-register">✅ Creează cont</button>
    </form>

    <p id="register-error" style="color: red; margin-top: 10px;"></p>

    <p class="login">Ai deja cont? <a href="login.html">Autentifică-te aici</a></p>
    <p class="footer">Creat cu ❤️ pentru iubitorii de cărți.</p>
</div>

<script src="register.js"></script>
</body>
</html>
