<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Înregistrare - Books on Web</title>
    <link rel="stylesheet" href="autentificare.css">
</head>
<body>
<div class="login-container">
    <h2>📚 Books on Web</h2>
    <h3>Înregistrare</h3>
    <form id="registerForm">
        <input type="text" name="username" placeholder="Nume utilizator" required>
        <input type="password" name="password" placeholder="Parolă" required>
        <input type="password" name="confirm" placeholder="Confirmă parolă" required>
        <button type="submit">Înregistrează-te</button>
    </form>
    <p>Ai deja cont? <a href="login.html">Autentifică-te</a></p>
    <p id="register-error" class="error"></p>
</div>

<script src="autentificare.js"></script>
</body>
</html>
