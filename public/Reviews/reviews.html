<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Recenzii - Books on Web</title>
    <link rel="stylesheet" href="reviews.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div class="logo">📝 Recenzii</div>
        <div>
            <a href="/Homepage/homepage.html" class="back-btn">🏠 Înapoi</a>
            <button id="logout" class="logout-btn">Logout</button>
        </div>
    </nav>

    <h1>Adaugă o recenzie</h1>

    <form id="reviewForm">
        <select id="bookSelect" required>
            <option value="">Alege o carte</option>
        </select>
        <textarea id="comment" placeholder="Scrie recenzia ta..." required></textarea>
        <button type="submit">Trimite recenzia</button>
    </form>
    <div id="errorMsg" class="error-message" style="display: none;"></div>
    <select id="rating" required>
        <option value="">Alege o evaluare</option>
        <option value="1">★☆☆☆☆</option>
        <option value="2">★★☆☆☆</option>
        <option value="3">★★★☆☆</option>
        <option value="4">★★★★☆</option>
        <option value="5">★★★★★</option>
    </select>


    <h2>Recenzii recente</h2>
    <div class="filter-bar">
        <label for="filterSelect">Filtrează după carte:</label>
        <select id="filterSelect">
            <option value="all">Toate cărțile</option>
        </select>
    </div>
    <div class="filter-bar">
        <label for="sortSelect">Sortează după:</label>
        <select id="sortSelect">
            <option value="recent">Cele mai recente</option>
            <option value="high">Cele mai bune</option>
            <option value="low">Cele mai slabe</option>
        </select>
    </div>
    <section id="reviewList" class="review-list"></section>
    <button id="showMoreBtn" class="show-more" style="display: none;">🔽 Vezi mai multe recenzii</button>

</div>

<script src="reviews.js"></script>
</body>
</html>
